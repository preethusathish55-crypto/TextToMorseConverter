<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Morse Code Communication</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Outfit", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 text-white">

  <nav class="px-8 py-5 flex justify-between items-center">
    <h1 class="text-2xl font-bold tracking-wide">MorseSecure</h1>

    <div class="flex gap-6 text-sm text-slate-300">
      <a href="/" class="hover:text-white">Home</a>
      <a href="/history" class="hover:text-white">History</a>
    </div>
  </nav>

  <section class="min-h-[85vh] px-6 py-10">
    <div class="max-w-5xl mx-auto">

      <a href="/" class="inline-block mb-6 text-blue-300 hover:text-white">
        ← Back
      </a>

      <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 shadow-2xl mb-8">
        <p class="text-blue-300 font-semibold mb-2">Original Text</p>
        <h2 class="text-3xl font-bold break-words">
          {{ data.original }}
        </h2>
      </div>

      <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 shadow-2xl">
        <p class="text-purple-300 font-semibold mb-2">
          {{ data.operation }} Result
        </p>

        <h2
          id="resultText"
          class="text-3xl font-bold break-words mb-8 text-white"
        >
          {{ data.result | lower }}
        </h2>

        <div class="flex items-center gap-4 flex-wrap">
          <button
            onclick="copyResult()"
            class="px-6 py-3 rounded-xl bg-green-500 hover:bg-green-600 text-white font-semibold duration-200"
          >
            Copy Result
          </button>

          <button
            onclick="downloadResult()"
            class="px-6 py-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-semibold duration-200"
          >
            Download TXT
          </button>

          <button
            onclick="playMorse()"
            class="px-6 py-3 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-semibold duration-200"
          >
            Play Morse Audio
          </button>

          <a
            href="/history"
            class="px-6 py-3 rounded-xl bg-purple-500 hover:bg-purple-600 text-white font-semibold duration-200"
          >
            View History
          </a>
        </div>
      </div>

    </div>
  </section>

  <footer class="text-center py-5 text-slate-400 text-sm">
    © 2026 Secure Morse Code Communication
  </footer>

  <script>
    function copyResult() {
      const result = document.getElementById("resultText").innerText;
      navigator.clipboard.writeText(result);
      alert("Result copied successfully!");
    }

    function downloadResult() {
      const result = document.getElementById("resultText").innerText;
      const file = new Blob([result], { type: "text/plain" });
      const link = document.createElement("a");

      link.href = URL.createObjectURL(file);
      link.download = "morse_result.txt";
      link.click();
    }

    function playMorse() {
      const morse = document.getElementById("resultText").innerText;
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      let time = audioContext.currentTime;

      morse.split("").forEach((char) => {
        if (char === ".") {
          beep(time, 0.12);
          time += 0.22;
        } else if (char === "-") {
          beep(time, 0.35);
          time += 0.45;
        } else if (char === " ") {
          time += 0.25;
        } else if (char === "/") {
          time += 0.5;
        }
      });

      function beep(start, duration) {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 650;

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        gainNode.gain.setValueAtTime(0.4, start);
        oscillator.start(start);
        oscillator.stop(start + duration);
      }
    }
  </script>

</body>
</html><body class="min-h-screen bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 text-white">
