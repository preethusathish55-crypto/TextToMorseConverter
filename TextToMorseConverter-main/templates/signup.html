<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signup - MorseSecure</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body{
      font-family:'Outfit',sans-serif;
    }
  </style>

</head>

<body class="min-h-screen bg-gradient-to-br from-sky-100 via-indigo-100 to-purple-100 flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-white/70 backdrop-blur-xl rounded-[30px] shadow-2xl p-8 border border-white/40">

    <h1 class="text-4xl font-extrabold text-slate-800 text-center">
      Create Account
    </h1>

    <p class="text-center text-slate-600 mt-2">
      Join MorseSecure today
    </p>

    <form method="POST" class="mt-8 space-y-5">

      <input
        type="text"
        name="username"
        placeholder="Enter Username"
        required
        class="w-full p-4 rounded-2xl outline-none bg-white shadow-inner"
      >

      <input
        type="email"
        name="email"
        placeholder="Enter Email"
        required
        class="w-full p-4 rounded-2xl outline-none bg-white shadow-inner"
      >

      <input
        type="password"
        name="password"
        placeholder="Enter Password"
        required
        class="w-full p-4 rounded-2xl outline-none bg-white shadow-inner"
      >

      <button
        type="submit"
        class="w-full py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-lg hover:scale-105 duration-300"
      >
        Signup
      </button>

    </form>

    <p class="text-center mt-6 text-slate-700">
      Already have an account?

      <a href="/login" class="text-blue-600 font-semibold">
        Login
      </a>
    </p>

  </div>

</body>
</html>
